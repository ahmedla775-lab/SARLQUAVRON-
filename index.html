<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUAVRON | Future Ecosystem</title>

<!-- استيراد خطوط فاخرة ومتوافقة مع التصميم التقني -->
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Cairo:wght@300;400;700;900&family=Orbitron:wght@500;900&display=swap" rel="stylesheet">

<style>
/* ================= الـثـيـم والـمـتـغـيـرات الـرئـيـسـيـة ================= */
:root {
  --bg-dark: #050505;
  --panel-dark: #0d0d11;
  --accent-cyan: #00f0ff;
  --accent-purple: #7000ff;
  --text-main: #ffffff;
  --text-muted: #8f9cae;
  --border-color: rgba(255, 255, 255, 0.06);
  --glass-bg: rgba(13, 13, 17, 0.7);
  --glass-blur: blur(20px);
}

/* ================= الـهـيـكـل الـعـام ================= */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: 'Cairo', 'Orbitron', sans-serif;
  background-color: var(--bg-dark);
  color: var(--text-main);
  overflow-x: hidden;
  position: relative;
}

/* تأثير الإضاءة الخلفية المحيطية الفاخرة */
body::before {
  content: '';
  position: absolute;
  top: -10%;
  left: -20%;
  width: 60vw;
  height: 60vw;
  background: radial-gradient(circle, rgba(0, 240, 255, 0.05) 0%, transparent 70%);
  z-index: -1;
  pointer-events: none;
}

body::after {
  content: '';
  position: absolute;
  top: 40%;
  right: -20%;
  width: 70vw;
  height: 70vw;
  background: radial-gradient(circle, rgba(112, 0, 255, 0.04) 0%, transparent 70%);
  z-index: -1;
  pointer-events: none;
}

/* ================= شـريـط الـتـنـقـل الـعـالـمـي ================= */
nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 6%;
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border-bottom: 1px solid var(--border-color);
  z-index: 10000;
}

.logo {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: 24px;
  letter-spacing: 3px;
  background: linear-gradient(90deg, #fff, var(--accent-cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.nav-links {
  display: flex;
  gap: 25px;
}

.nav-links a {
  color: var(--text-muted);
  font-size: 14px;
  font-weight: 400;
  letter-spacing: 1px;
  transition: color 0.3s ease, transform 0.3s ease;
  position: relative;
  padding: 5px 0;
}

.nav-links a:hover {
  color: var(--text-main);
}

.nav-links a::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 0;
  height: 2px;
  background: var(--accent-cyan);
  transition: width 0.3s ease;
}

.nav-links a:hover::after {
  width: 100%;
}

/* ================= واجـهـة الـهـيـرو الـسـيـنـمـائـيـة ================= */
.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 0 20px;
  position: relative;
  background: radial-gradient(circle at center, rgba(13, 13, 17, 0.2) 0%, var(--bg-dark) 100%);
}

/* تأثير الخلفية الشبكية الدقيقة المستوحى من تسلا */
.hero-grid {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: linear-gradient(rgba(255,255,255,0.01) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.01) 1px, transparent 1px);
  background-size: 50px 50px;
  z-index: 1;
  pointer-events: none;
}

.hero-content {
  position: relative;
  z-index: 2;
  max-width: 900px;
}

.hero-badge {
  display: inline-block;
  padding: 6px 16px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 30px;
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--accent-cyan);
  margin-bottom: 25px;
  text-transform: uppercase;
}

.hero h1 {
  font-family: 'Orbitron', 'Cairo', sans-serif;
  font-size: clamp(40px, 6vw, 85px);
  font-weight: 900;
  line-height: 1.1;
  margin-bottom: 20px;
  letter-spacing: -1px;
  background: linear-gradient(180deg, #ffffff 30%, #a5b4fc 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero p {
  color: var(--text-muted);
  font-size: clamp(16px, 2vw, 20px);
  max-width: 650px;
  margin: 0 auto 40px auto;
  line-height: 1.8;
  font-weight: 300;
}

/* ================= الأقـسـام والـعـنـاويـن ================= */
section {
  padding: 140px 6%;
  position: relative;
  max-width: 1600px;
  margin: 0 auto;
}

.section-header {
  text-align: center;
  margin-bottom: 80px;
}

.section-header h2 {
  font-size: clamp(28px, 4vw, 42px);
  font-weight: 700;
  letter-spacing: -0.5px;
  margin-bottom: 15px;
}

.section-header p {
  color: var(--text-muted);
  font-size: 16px;
  max-width: 500px;
  margin: 0 auto;
}

/* ================= نـظـام الـبـطـاقـات الـمـتـطـور ================= */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 30px;
}

.card {
  background: var(--panel-dark);
  border: 1px solid var(--border-color);
  padding: 40px;
  border-radius: 24px;
  transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(180deg, rgba(0, 240, 255, 0.02) 0%, transparent 100%);
  opacity: 0;
  transition: opacity 0.5s ease;
}

.card:hover {
  transform: translateY(-8px);
  border-color: rgba(0, 240, 255, 0.3);
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
}

.card:hover::before {
  opacity: 1;
}

.card h3 {
  font-size: 22px;
  margin-bottom: 15px;
  font-weight: 700;
}

.card p {
  color: var(--text-muted);
  line-height: 1.7;
  font-size: 15px;
  font-weight: 300;
}

/* ================= قـسـم الـمـنـتـجـات (أسـلـوب شـاومـي وتـسـلا) ================= */
.product-card {
  background: #09090d;
  border: 1px solid var(--border-color);
  border-radius: 32px;
  overflow: hidden;
  transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.product-img-holder {
  background: linear-gradient(180deg, #111116 0%, #09090d 100%);
  height: 280px;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
}

/* بديل للمجسم الصوري لعرض فخامة المنتج */
.product-visual-mock {
  width: 120px;
  height: 120px;
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
  border-radius: 30px;
  filter: drop-shadow(0 0 30px rgba(0,240,255,0.3));
  transition: transform 0.5s ease;
}

.product-card:hover .product-visual-mock {
  transform: scale(1.1) rotate(10deg);
}

.product-info {
  padding: 35px;
}

.product-info h3 {
  font-size: 24px;
  margin-bottom: 10px;
}

.product-info p {
  color: var(--text-muted);
  font-size: 14px;
  margin-bottom: 25px;
  line-height: 1.6;
}

/* ================= أزرار مـسـتـقـبـلـيـة عـالـمـيـة ================= */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 14px 32px;
  border-radius: 50px;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  text-decoration: none;
}

.btn-primary {
  background: var(--text-main);
  color: var(--bg-dark);
  border: none;
}

.btn-primary:hover {
  background: var(--accent-cyan);
  transform: scale(1.03);
}

.btn-secondary {
  background: transparent;
  color: var(--text-main);
  border: 1px solid rgba(255,255,255,0.2);
}

.btn-secondary:hover {
  border-color: var(--text-main);
  background: rgba(255,255,255,0.02);
}

.hero-buttons {
  display: flex;
  gap: 20px;
  justify-content: center;
}

/* ================= قـسـم الاسـتـثـمـار R&D ================= */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 40px;
  margin-top: 60px;
  text-align: center;
}

.stat-item h4 {
  font-family: 'Orbitron', sans-serif;
  font-size: 48px;
  color: var(--accent-cyan);
  font-weight: 900;
  margin-bottom: 5px;
}

.stat-item p {
  color: var(--text-muted);
  font-size: 14px;
  letter-spacing: 1px;
}

/* ================= نـظـام الـمـيـديـا الـتـفـاعـلـي ================= */
.media-container {
  background: var(--panel-dark);
  border: 1px solid var(--border-color);
  padding: 40px;
  border-radius: 24px;
  text-align: center;
}

.upload-box {
  border: 2px dashed rgba(255,255,255,0.1);
  padding: 40px 20px;
  border-radius: 16px;
  cursor: pointer;
  transition: background 0.3s;
  margin-bottom: 40px;
}

.upload-box:hover {
  background: rgba(0, 240, 255, 0.01);
  border-color: var(--accent-cyan);
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
}

.gallery-item {
  position: relative;
  border-radius: 16px;
  overflow: hidden;
  aspect-ratio: 1;
}

.gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s ease;
}

.gallery-item:hover img {
  transform: scale(1.08);
}

/* ================= نـظـام الـحـركـة الـفـاخـر (Scroll Motion) ================= */
.scroll-reveal {
  opacity: 0;
  transform: translateY(40px);
  transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.scroll-reveal.active {
  opacity: 1;
  transform: translateY(0);
}

/* ================= الـتـذيـيـل (Footer) ================= */
footer {
  background: #020203;
  padding: 80px 6% 40px 6%;
  border-top: 1px solid var(--border-color);
}

.footer-content {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 50px;
  margin-bottom: 60px;
}

.footer-col h5 {
  font-size: 14px;
  letter-spacing: 1px;
  margin-bottom: 20px;
  text-transform: uppercase;
  color: #fff;
}
