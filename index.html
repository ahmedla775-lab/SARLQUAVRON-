<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUAVRON | Future Ecosystem</title>

<!-- استيراد الخطوط الفاخرة المخصصة للواجهات التقنية -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&family=Orbitron:wght@500;900&display=swap" rel="stylesheet">

<style>
/* ================= الـثـيـم والـمـتـغـيـرات الـرئـيـسـيـة ================= */
:root {
  --bg-dark: #050505;
  --panel-dark: #0c0c10;
  --accent-cyan: #00f0ff;
  --accent-purple: #7000ff;
  --text-main: #ffffff;
  --text-muted: #8f9cae;
  --border-color: rgba(255, 255, 255, 0.05);
  --glass-bg: rgba(10, 10, 14, 0.75);
  --glass-blur: blur(20px);
}

/* ================= الـهـيـكـل الـعـام والـتـصـفـيـر ================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html { 
  scroll-behavior: smooth; 
}

body {
  font-family: 'Cairo', sans-serif;
  background: var(--bg-dark);
  color: var(--text-main);
  overflow-x: hidden;
  position: relative;
}

/* تأثير الإضاءة المحيطية السينمائية المستوحى من منصات التكنولوجيا العظمى */
body::before, body::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  z-index: -1;
  pointer-events: none;
  filter: blur(120px);
}
body::before {
  top: -10%; left: -10%; width: 50vw; height: 50vw;
  background: radial-gradient(circle, rgba(0, 240, 255, 0.04) 0%, transparent 70%);
}
body::after {
  top: 50%; right: -10%; width: 60vw; height: 60vw;
  background: radial-gradient(circle, rgba(112, 0, 255, 0.03) 0%, transparent 70%);
}

/* ================= شـريـط الـتـنـقـل الـعـالـمـي ================= */
nav {
  position: fixed;
  width: 100%;
  top: 0;
  left: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px 6%;
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border-bottom: 1px solid var(--border-color);
  z-index: 10000;
}

.logo {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: 22px;
  letter-spacing: 2px;
  background: linear-gradient(90deg, #ffffff, var(--accent-cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.nav-links {
  display: flex;
  gap: 25px;
}

.nav-links a {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 14px;
  font-weight: 400;
  transition: color 0.3s ease;
  position: relative;
  padding: 4px 0;
}

.nav-links a:hover {
  color: var(--text-main);
}

.nav-links a::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 0;
  height: 2px;
  background: var(--accent-cyan);
  transition: width 0.3s ease;
}

.nav-links a:hover::after {
  width: 100%;
}

/* ================= واجـهـة الـهـيـرو (الافتتاحية) ================= */
.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 0 20px;
  position: relative;
}

/* خلفية دقيقة بنمط الشبكة الهندسية (Grid Layer) لأسلوب تسلا */
.hero-grid {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background-image: linear-gradient(rgba(255,255,255,0.008) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.008) 1px, transparent 1px);
  background-size: 60px 60px;
  z-index: 1;
  pointer-events: none;
}

.hero-content {
  position: relative;
  z-index: 2;
  max-width: 850px;
}

.hero h1 {
  font-family: 'Orbitron', 'Cairo', sans-serif;
  font-size: clamp(38px, 6vw, 76px);
  font-weight: 900;
  line-height: 1.15;
  background: linear-gradient(180deg, #ffffff 40%, #a5b4fc 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -1px;
}

.hero p {
  color: var(--text-muted);
  font-size: clamp(15px, 2vw, 19px);
  max-width: 650px;
  margin: 25px auto 40px auto;
  line-height: 1.8;
  font-weight: 300;
}

/* ================= الأقـسـام والـعـنـاويـن ================= */
section {
  padding: 140px 6%;
  max-width: 1600px;
  margin: 0 auto;
}

.section-header {
  text-align: center;
  margin-bottom: 75px;
}

.section-header h2 {
  font-size: clamp(26px, 4vw, 38px);
  font-weight: 700;
  letter-spacing: -0.5px;
  margin-bottom: 15px;
}

.section-header p {
  color: var(--text-muted);
  font-size: 15px;
  max-width: 550px;
  margin: 0 auto;
}

/* ================= نـظـام الـشـبـكـات والـبـطـاقـات ================= */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 30px;
}

.card {
  background: var(--panel-dark);
  border: 1px solid var(--border-color);
  padding: 40px 35px;
  border-radius: 24px;
  transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
  overflow: hidden;
}

.card:hover {
  transform: translateY(-8px);
  border-color: rgba(0, 240, 255, 0.3);
  box-shadow: 0 20px 40px rgba(0,0,0,0.6);
}

.card h3 {
  font-size: 20px;
  margin-bottom: 15px;
  font-weight: 700;
}

.card p {
  color: var(--text-muted);
  line-height: 1.7;
  font-size: 14px;
  font-weight: 300;
}

/* ================= قـسـم الـمـتـجـر والـمـنـتـجـات الفاخرة ================= */
.product-card {
  background: #09090d;
  border: 1px solid var(--border-color);
  border-radius: 28px;
  overflow: hidden;
  transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
}

.product-card:hover {
  transform: translateY(-8px);
  border-color: rgba(112, 0, 255, 0.3);
  box-shadow: 0 20px 40px rgba(0,0,0,0.6);
}

.product-img-holder {
  background: linear-gradient(180deg, #121218 0%, #09090d 100%);
  height: 260px;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* مجسم هندسي ضوئي تفاعلي كبديل للملفات الصورية غير المتوفرة */
.product-visual-mock {
  width: 100px;
  height: 100px;
  border-radius: 24px;
  filter: drop-shadow(0 0 25px rgba(0,240,255,0.25));
  transition: transform 0.6s ease;
}

.product-card:hover .product-visual-mock {
  transform: scale(1.1) rotate(8deg);
}

.product-info {
  padding: 30px;
}

.product-info h3 {
  font-size: 22px;
  margin-bottom: 10px;
}

.product-info p {
  color: var(--text-muted);
  font-size: 14px;
  margin-bottom: 25px;
  line-height: 1.6;
}

/* ================= أزرار الـتـحـكـم والـطـلـب ================= */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 12px 30px;
  border-radius: 50px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  text-decoration: none;
  border: none;
}

.btn-primary {
  background: var(--text-main);
  color: var(--bg-dark);
}

.btn-primary:hover {
  background: var(--accent-cyan);
  transform: scale(1.02);
}

.btn-secondary {
  background: transparent;
  color: var(--text-main);
  border: 1px solid rgba(255,255,255,0.15);
}

.btn-secondary:hover {
  border-color: var(--text-main);
  background: rgba(255,255,255,0.02);
}

.hero-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
}

/* ================= قـسـم الـمـؤشـرات الاحـصـائـيـة ================= */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 30px;
  margin-top: 50px;
  text-align: center;
}

.stat-item h4 {
  font-family: 'Orbitron', sans-serif;
  font-size: 42px;
  color: var(--accent-cyan);
  font-weight: 900;
  margin-bottom: 5px;
}

.stat-item p {
  color: var(--text-muted);
  font-size: 13px;
}

/* ================= نـظـام الـمـيـديـا والـرفـع الاسـتـحـدادي ================= */
.media-container {
  background: var(--panel-dark);
  border: 1px solid var(--border-color);
  padding: 40px;
  border-radius: 24px;
}

.upload-box {
  border: 2px dashed rgba(255,255,255,0.08);
  padding: 45px 20px;
  border-radius: 16px;
  cursor: pointer;
  text-align: center;
  transition: all 0.3s ease;
  margin-bottom: 40px;
}

.upload-box:hover {
  background: rgba(0, 240, 255, 0.01);
  border-color: var(--accent-cyan);
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
}

.gallery-item {
  position: relative;
  border-radius: 16px;
  overflow: hidden;
  aspect-ratio: 1;
  border: 1px solid var(--border-color);
}

.gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s ease;
}

.gallery-item:hover img {
  transform: scale(1.06);
}

/* ================= نـظـام الـحـركـة والانـسـيـابـية (Scroll Reveal) ================= */
.scroll {
  opacity: 0;
  transform: translateY(40px);
  transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.scroll.active {
  opacity: 1;
  transform: translateY(0);
}

/* ================= الـتـذيـيـل الـعـالـمـي (Footer) ================= */
footer {
  background: #020203;
  padding: 80px 6% 40px 6%;
  border-top: 1px solid var(--border-color);
}

.footer-content {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 50px;
  margin-bottom: 50px;
}

.footer-col h5 {
  font-size: 13px;
  letter-spacing: 1px;
  margin-bottom: 20px;
  text-transform: uppercase;
}

.footer-col ul {
  list-style: none;
}

.footer-col ul li {
  margin-bottom: 12px;
}

.footer-col ul li a {
  color: var(--text-muted);
  font-size: 14px;
  text-decoration: none;
  transition: color 0.2s;
}

.footer-col ul li a:hover {
  color: var(--accent-cyan);
}

.footer-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #444;
  font-size: 13px;
  border-top: 1px solid rgba(255,255,255,0.02);
  padding-top: 30px;
}

/* ================= الـتـجـاوب مـع الـشـاشـات الـصـغـيـرة ================= */
@media (max-width: 768px) {
  nav { padding: 15px 4%; }
  .nav-links { display: none; }
  section { padding: 80px 4%; }
  .hero h1 { font-size: 40px; }

</style>
</head>

<body>

<nav>
  <div class="logo">QUAVRON</div>
</nav>

<section class="hero">
  <div class="hero-grid"></div>

  <div class="hero-content">
    <h1>QUAVRON FUTURE</h1>
    <p>منصة تقنية مستقبلية</p>

    <div class="hero-buttons">
      <a class="btn btn-primary">ابدأ</a>
      <a class="btn btn-secondary">استكشف</a>
    </div>
  </div>
</section>

<script>
document.querySelectorAll('.scroll').forEach(el => {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if(e.isIntersecting) e.target.classList.add('active');
    });
  });
  obs.observe(el);
});
</script>

</body>
</html>
