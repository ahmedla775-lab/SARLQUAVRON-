<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QUAVRON PLATFORM</title>

<style>

/* ================= CORE ================= */

html {
  scroll-behavior: smooth;
}

body{
  margin:0;
  font-family:Cairo, sans-serif;
  background:#0a0a0a;
  color:#fff;
  perspective:1000px;
  overflow-x:hidden;
}

a{color:#aaa;text-decoration:none}
a:hover{color:#fff}

/* ================= NAV ================= */

nav{
  position:fixed;
  top:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:18px 40px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(15px);
  border-bottom:1px solid #222;
  z-index:1000;
}

.logo{
  font-weight:900;
  font-size:20px;
  color:#00e5ff;
}

nav div a{
  margin:0 10px;
  font-size:14px;
}

/* ================= HERO ================= */

.hero{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

.hero h1{
  font-size:70px;
  margin:0;
  background:linear-gradient(45deg,#fff,#00e5ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero p{
  color:#aaa;
  max-width:600px;
  line-height:1.8;
}

/* ================= SECTIONS ================= */

section{
  padding:100px 40px;
}

/* ================= GRID ================= */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:#151515;
  padding:25px;
  border-radius:15px;
  border:1px solid #222;
  transition:0.6s cubic-bezier(.2,.8,.2,1);
}

.product{
  background:#111;
  padding:20px;
  border-radius:15px;
  text-align:center;
  transition:0.6s cubic-bezier(.2,.8,.2,1);
}

/* ================= HOVER DEPTH ================= */

.card:hover,
.product:hover{
  transform:translateY(-12px) scale(1.03);
  border-color:#00e5ff;
}

/* ================= BUTTON ================= */

button{
  margin-top:10px;
  padding:10px 20px;
  border:none;
  background:#00e5ff;
  color:#000;
  font-weight:bold;
  cursor:pointer;
  border-radius:20px;
  transition:0.3s;
}

button:hover{
  transform:scale(1.05);
}

/* ================= MOTION SYSTEM ================= */

section, .card, .product, .hero h1, .hero p{
  opacity:0;
  transform:translateY(60px);
  transition:0.9s cubic-bezier(.2,.8,.2,1);
}

.show{
  opacity:1 !important;
  transform:translateY(0) !important;
}

/* ================= FOOTER ================= */

footer{
  text-align:center;
  padding:30px;
  color:#777;
  border-top:1px solid #222;
}

</style>

</head>

<body>

<!-- NAV -->
<nav>
  <div class="logo">QUAVRON</div>
  <div>
    <a href="#home">الرئيسية</a>
    <a href="#about">عن</a>
    <a href="#store">المتجر</a>
    <a href="#media">الميديا</a>
  </div>
</nav>

<!-- HERO -->
<section id="home" class="hero">
  <div>
    <h1>QUAVRON PLATFORM</h1>
    <p>منصة تقنية متكاملة تجمع بين الذكاء الاصطناعي والمتجر وإدارة المحتوى</p>
  </div>
</section>

<!-- ABOUT -->
<section id="about">
  <h2 style="text-align:center">عن المنصة</h2>

  <div class="grid">
    <div class="card">🚀 AI Systems</div>
    <div class="card">☁ Cloud Platform</div>
    <div class="card">🛒 E-Commerce</div>
    <div class="card">📱 Content System</div>
  </div>
</section>

<!-- STORE -->
<section id="store">
  <h2 style="text-align:center">المتجر</h2>

  <div class="grid">

    <div class="product">
      <h3>Product A</h3>
      <p>وصف المنتج</p>
      <button>شراء</button>
    </div>

    <div class="product">
      <h3>Product B</h3>
      <p>وصف المنتج</p>
      <button>شراء</button>
    </div>

  </div>
</section>

<!-- MEDIA -->
<section id="media">
  <h2 style="text-align:center">الميديا</h2>

  <div class="grid" id="gallery"></div>
</section>

<!-- FOOTER -->
<footer>
© 2026 QUAVRON PLATFORM
</footer>

<script>

/* ================= SCROLL ANIMATION ================= */

const elements = document.querySelectorAll(
  "section, .card, .product, .hero h1, .hero p"
);

function reveal(){
  elements.forEach(el=>{
    const rect = el.getBoundingClientRect();

    if(rect.top < window.innerHeight - 80){
      el.classList.add("show");
    }
  });
}

window.addEventListener("scroll", reveal);
window.addEventListener("load", reveal);

/* ================= PARALLAX LIGHT EFFECT ================= */

document.addEventListener("mousemove", (e)=>{
  const x = (e.clientX / window.innerWidth - 0.5) * 5;
  const y = (e.clientY / window.innerHeight - 0.5) * 5;

  document.body.style.transform =
    `rotateX(${-y}deg) rotateY(${x}deg)`;
});

/* ================= IMAGE UPLOAD ================= */

function loadFiles(event){
  const gallery = document.getElementById("gallery");

  for(let file of event.target.files){
    const reader = new FileReader();

    reader.onload = function(e){
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `<img src="${e.target.result}" style="width:100%;border-radius:10px">`;
      gallery.appendChild(div);
    }

    reader.readAsDataURL(file);
  }
}

</script>

</body>
</html>
